# Copy to .github/workflows/pr-gate.yml in the repository you want to gate.
name: pr-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: Hus-Mek/pr-gate-action/.github/workflows/gate.yml@v1
    with:
      gate_ref: v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PR_GATE_PUSH_TOKEN: ${{ secrets.PR_GATE_PUSH_TOKEN }}
